<style>
        .scanning-beam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, rgba(67, 56, 202, 0.8), transparent);
            box-shadow: 0 0 12px rgba(67, 56, 202, 0.6);
            animation: scan 2s linear infinite;
            display: none;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .network-pattern {
            background-image: radial-gradient(circle, #E5E5E1 1px, transparent 1px),
                              linear-gradient(to right, #E5E5E1 0.5px, transparent 0.5px),
                              linear-gradient(to bottom, #E5E5E1 0.5px, transparent 0.5px);
            background-size: 40px 40px, 40px 40px, 40px 40px;
            background-position: 0 0, 20px 0, 0 20px;
            opacity: 0.3;
        }

        .drop-zone {
            transition: all 0.3s ease;
        }

        .drop-zone.dragover {
            border-color: #4338ca;
            background-color: rgba(67, 56, 202, 0.05);
            box-shadow: 0 0 20px rgba(67, 56, 202, 0.1);
        }

        .radial-progress {
            transform: rotate(-90deg);
            transform-origin: center;
        }

        .progress-ring-circle {
            transition: stroke-dashoffset 0.1s linear;
        }
    </style>
</head>
<body class="bg-background text-on-background h-full font-body-main relative overflow-hidden flex flex-col items-center justify-center">
<!-- Network Pattern Background -->
<div class="absolute inset-0 network-pattern pointer-events-none"></div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-[600px] px-margin-mobile md:px-0">
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-headline-md text-headline-md text-primary mb-2">New Analysis</h1>
<p class="font-body-main text-body-main text-on-surface-variant">Upload technical documents to map prior-art connections.</p>
</div>
<!-- Upload Zone -->
<div class="drop-zone relative w-full h-[400px] border border-outline-variant rounded bg-surface/80 backdrop-blur-md flex flex-col items-center justify-center cursor-pointer group hover:border-primary/50 overflow-hidden" id="dropZone">
<div class="scanning-beam" id="scanningBeam"></div>
<!-- Initial State Content -->
<div class="flex flex-col items-center justify-center text-center p-8 transition-opacity duration-300" id="uploadContent">
<span class="material-symbols-outlined text-[48px] text-outline mb-4 group-hover:text-primary transition-colors">upload_file</span>
<p class="font-data-label text-data-label text-on-surface mb-2">Drag &amp; Drop Technical Documents</p>
<p class="font-caption text-caption text-on-surface-variant">Supported formats: PDF, TXT, DOCX (Max 50MB)</p>
<button class="mt-6 px-6 py-2 bg-primary-container text-on-primary rounded text-data-label font-data-label hover:bg-primary transition-colors">
                    Browse Files
                </button>
</div>
<!-- Processing State Content (Hidden Initially) -->
<div class="absolute inset-0 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 bg-surface/90 backdrop-blur-sm" id="processingContent">
<div class="relative w-32 h-32 mb-6">
<svg class="w-full h-full radial-progress" viewbox="0 0 120 120">
<circle class="text-surface-variant" cx="60" cy="60" fill="transparent" r="54" stroke="currentColor" stroke-width="4"></circle>
<circle class="progress-ring-circle text-primary" cx="60" cy="60" fill="transparent" id="progressRing" r="54" stroke="currentColor" stroke-dasharray="339.292" stroke-dashoffset="339.292" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<div class="absolute inset-0 flex items-center justify-center">
<span class="font-data-value text-data-value text-primary font-bold" id="progressText">0%</span>
</div>
</div>
<p class="font-data-value text-data-value text-on-surface animate-pulse">Analyzing technical novelty...</p>
<div class="mt-8 font-caption text-caption text-on-surface-variant flex flex-col gap-2 opacity-70">
<div class="flex items-center gap-2"><span class="material-symbols-outlined text-[14px]">check_circle</span> Extracting claims</div>
<div class="flex items-center gap-2"><span class="material-symbols-outlined text-[14px] animate-spin">sync</span> Mapping vector space</div>
</div>
</div>
</div>
</main>
<!-- Navigation Shell (Suppressed as per rules for transactional/linear intent) -->
<script>
        const dropZone = document.getElementById('dropZone');
        const uploadContent = document.getElementById('uploadContent');
        const processingContent = document.getElementById('processingContent');
        const scanningBeam = document.getElementById('scanningBeam');
        const progressRing = document.getElementById('progressRing');
        const progressText = document.getElementById('progressText');

        // Drag and Drop Events
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('dragover');
        }

        function unhighlight(e) {
            dropZone.classList.remove('dragover');
        }

        dropZone.addEventListener('drop', handleDrop, false);
        
        // Also allow click to simulate upload for demonstration
        uploadContent.querySelector('button').addEventListener('click', (e) => {
            e.stopPropagation();
            startProcessing();
        });

        function handleDrop(e) {
            startProcessing();
        }

        function startProcessing() {
            // UI State Transition
            uploadContent.style.opacity = '0';
            setTimeout(() => {
                uploadContent.style.display = 'none';
                processingContent.style.opacity = '1';
                scanningBeam.style.display = 'block';
                simulateProgress();
            }, 300);
        }

        function simulateProgress() {
            let progress = 0;
            const circumference = 54 * 2 * Math.PI;
            
            const interval = setInterval(() => {
                progress += Math.random() * 5;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    
                    // Simulate completion transition
                    setTimeout(() => {
                        progressText.innerHTML = '<span class="material-symbols-outlined">check</span>';
                        document.querySelector('#processingContent p').textContent = 'Analysis Complete';
                        scanningBeam.style.display = 'none';
                    }, 500);
                }
                
                const offset = circumference - (progress / 100) * circumference;
                progressRing.style.strokeDashoffset = offset;
                progressText.textContent = `${Math.floor(progress)}%`;
                
            }, 150);
        }
    </script>
</body></html>
